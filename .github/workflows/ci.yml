name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m py_compile main.py check_google.py check_drivemcp.py src/config.py src/google_auth.py src/foundry_agent.py

      - name: Import smoke test (no network / no secrets)
        run: python -c "import src.config, src.google_auth, src.foundry_agent; print('imports OK')"
